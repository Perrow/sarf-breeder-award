{% extends "base.html" %}

{% block title %}Återställ lösenord | Odlingskampanjen{% endblock %}

{% block content %}
<div class="form-page">
    <h1>Återställ lösenord</h1>
    <p class="form-intro">Ange e-postadressen för ditt konto så skickar vi en återställningslänk.</p>
    <form method="post" class="site-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Skicka återställningslänk</button>
        </div>
    </form>
</div>
{% endblock %}
