{% extends "base.html" %}

{% block title %}Välj nytt lösenord | Odlingskampanjen{% endblock %}

{% block content %}
<div class="form-page">
    <h1>Välj nytt lösenord</h1>
    {% if validlink %}
    <form method="post" class="site-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Spara nytt lösenord</button>
        </div>
    </form>
    {% else %}
    <p>Återställningslänken är ogiltig eller har redan använts.</p>
    {% endif %}
</div>
{% endblock %}
