{% extends "base.html" %}

{% block title %}Redigera konto | Odlingskampanjen{% endblock %}

{% block content %}
<div class="form-page">
    <h1>Redigera konto</h1>

    <form method="post" class="site-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Spara</button>
            <a class="btn btn-outline-secondary" href="{% url 'account' %}">Avbryt</a>
        </div>
    </form>
</div>
{% endblock %}
