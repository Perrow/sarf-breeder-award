<article class="card flex-shrink-0" style="width: 220px;" data-achievement="{{ presentation.earned.achievement_name }}">
    <button
        type="button"
        class="card-body text-start border-0 bg-transparent"
        data-bs-toggle="popover"
        data-bs-trigger="hover focus"
        data-bs-placement="auto"
        data-bs-title="{{ presentation.earned.achievement_name }}"
        data-bs-content="Grad: {{ presentation.earned.level_name }}{% if show_year and presentation.earned.calendar_year %} · År: {{ presentation.earned.calendar_year }}{% endif %}{% if presentation.earned.level_description %} · {{ presentation.earned.level_description }}{% endif %}"
        aria-label="{{ presentation.earned.achievement_name }} – visa detaljer"
    >
        {% if presentation.background_image or presentation.overlay or presentation.level_overlay %}
        <div style="position:relative;width:200px;height:250px;overflow:hidden;">
            {% if presentation.background_image %}
            <img src="{{ presentation.background_image.url }}" alt="Bakgrund för {{ presentation.earned.achievement_name }}" style="position:absolute;inset:0;width:200px;height:250px;object-fit:contain;">
            {% if presentation.background_tint %}<span aria-hidden="true" style="position:absolute;inset:0;background:{{ presentation.background_tint }};mix-blend-mode:color;"></span>{% endif %}
            {% endif %}
            {% if presentation.overlay %}<img src="{{ presentation.overlay.url }}" alt="{{ presentation.earned.achievement_name }}" style="position:absolute;inset:0;width:200px;height:250px;object-fit:contain;z-index:2;">{% endif %}
            {% if presentation.level_overlay %}<img src="{{ presentation.level_overlay.url }}" alt="{{ presentation.earned.level_name }}" style="position:absolute;inset:0;width:200px;height:250px;object-fit:contain;z-index:3;">{% endif %}
        </div>
        {% endif %}
        <h3 class="h5 mt-3 mb-1">{{ presentation.earned.achievement_name }}</h3>
    </button>
</article>
