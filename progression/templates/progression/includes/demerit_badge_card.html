<article class="card flex-shrink-0" style="width: 12rem;">
    {% if grant.badge.image %}
        <img src="{{ grant.badge.image.url }}" class="card-img-top p-2" alt="">
    {% endif %}
    <div class="card-body">
        <p class="small text-body-secondary mb-1">De-merit badge · självtilldelad</p>
        <h3 class="h6 card-title mb-1">{{ grant.badge.name }}</h3>
        {% if grant.badge.description %}
            <p class="card-text small mb-2">{{ grant.badge.description }}</p>
        {% endif %}
        <p class="card-text small text-body-secondary mb-0">Tilldelad {{ grant.awarded_at|date:"Y-m-d" }}</p>
    </div>
</article>
