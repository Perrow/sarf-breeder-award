{% extends "admin/change_form.html" %}

{% block object-tools-items %}
{{ block.super }}
{% if original %}
<li>
    <form method="post" action="{% url 'admin:progression_achievement_revalidate' original.pk %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="button" onclick="return confirm('Granska utdelade utmärkelser mot nu gällande krav? Ogiltiga utdelningar tas bort och saknade giltiga utdelningar skapas.');">
            Granska utdelade utmärkelser
        </button>
    </form>
</li>
{% endif %}
{% endblock %}
