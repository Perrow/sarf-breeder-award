{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <p>Välj vilken art som ska finnas kvar. Odlingar och övriga artkopplingar flyttas till målarten och {{ source }} tas sedan bort.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="submit-row">
        <input type="submit" value="Slå ihop arter" class="default">
        <a href="{{ change_url }}" class="button cancel-link">Avbryt</a>
      </div>
    </form>
  </div>
{% endblock %}
