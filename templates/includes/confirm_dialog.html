<dialog class="site-confirm-dialog" data-confirm-dialog aria-labelledby="site-confirm-dialog-title" aria-describedby="site-confirm-dialog-message">
    <div class="site-confirm-dialog__panel">
        <div class="site-confirm-dialog__header">
            <h2 class="site-confirm-dialog__title" id="site-confirm-dialog-title" data-confirm-dialog-title>Bekräfta</h2>
            <button class="site-confirm-dialog__close" type="button" aria-label="Stäng" data-confirm-dialog-cancel>&times;</button>
        </div>
        <div class="site-confirm-dialog__body">
            <p class="mb-0" id="site-confirm-dialog-message" data-confirm-dialog-message></p>
        </div>
        <div class="site-confirm-dialog__footer">
            <button class="btn btn-outline-secondary" type="button" data-confirm-dialog-cancel>Avbryt</button>
            <button class="btn btn-primary" type="button" data-confirm-dialog-confirm>Fortsätt</button>
        </div>
    </div>
</dialog>
