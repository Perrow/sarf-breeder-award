<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md" aria-label="Huvudnavigation">
        <div class="container site-shell py-2">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                {% if site_branding and site_branding.header_logo %}
                    <img src="{{ site_branding.header_logo.url }}" alt="" style="max-height:48px;max-width:120px;width:auto;height:auto;" aria-hidden="true">
                {% endif %}
                <span>SARF / Odlingskampanjen</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Visa eller dölj navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto mb-2 mb-md-0 align-items-md-center">
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'breeding_list' %}">Min sida</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'leaderboards' %}">Topplistor</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'species_catalogue' %}">Arter</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'account' %}">Konto</a></li>
                        <li class="nav-item ms-md-2">
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button class="btn btn-outline-primary btn-sm" type="submit">Logga ut</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'leaderboards' %}">Topplistor</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Skapa konto</a></li>
                        <li class="nav-item ms-md-2 d-flex align-items-center"><a class="btn btn-primary btn-sm" href="{% url 'login' %}">Logga in</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
