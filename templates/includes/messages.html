{% if messages %}
    {% for message in messages %}
        {% if message.level_tag == "error" or message.level_tag == "warning" %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert" aria-live="assertive">
        {% elif message.level_tag == "debug" %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="note">
        {% else %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="status" aria-live="polite">
        {% endif %}
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Stäng meddelande"></button>
        </div>
    {% endfor %}
{% endif %}
